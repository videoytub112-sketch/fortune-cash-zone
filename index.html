<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Premium Traffic Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Красивый футуристичный фон с градиентом */
        body { 
            background: radial-gradient(circle at top, #141526 0%, #070810 100%); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
            gap: 15px;
            overflow-x: hidden;
        }
        
        /* Стеклянный неоновый корпус портала */
        .portal-shell { 
            width: 100%; 
            max-width: 400px; 
            background: rgba(31, 40, 51, 0.65); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(69, 243, 255, 0.25); 
            border-radius: 28px; 
            display: flex; 
            flex-direction: column; 
            padding: 20px; 
            gap: 18px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(102,252,241,0.05); 
        }
        
        .portal-header { text-align: center; position: relative; padding-bottom: 5px; }
        .portal-header h1 { 
            font-size: 24px; 
            color: #66fcf1; 
            text-shadow: 0 0 15px rgba(102,252,241,0.6); 
            font-weight: 900; 
            letter-spacing: 1px;
        }
        .portal-header p { font-size: 10px; color: #94a1c2; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }

        /* VIP БЛОК АДМИНИСТРАТОРА (Премиум дизайн) */
        .vip-admin-block { 
            width: 100%; 
            background: linear-gradient(135deg, #16192e 0%, #0b0c16 100%); 
            border: 2px solid #ffb167; 
            border-radius: 18px; 
            padding: 14px; 
            text-align: center; 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            align-items: center; 
            box-shadow: 0 0 20px rgba(255,177,103,0.25); 
        }
        .vip-badge { position: absolute; top: 0; left: 0; background: #ffb167; color: #0b0c10; font-size: 9px; font-weight: bold; padding: 3px 10px; border-bottom-right-radius: 10px; letter-spacing: 0.5px; }
        .vip-title { font-size: 13px; font-weight: 600; color: #fff; margin-top: 8px; line-height: 1.4; padding: 0 5px; }
        .vip-banner-img { width: 100%; max-height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .vk-btn { 
            width: 95%; 
            height: 38px; 
            background: linear-gradient(90deg, #0066ff 0%, #00bfff 100%); 
            border: none; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-decoration: none; 
            box-shadow: 0 4px 15px rgba(0,102,255,0.4); 
            transition: all 0.2s;
        }
        .vk-btn:active { transform: scale(0.97); }

        /* УНИВЕРСАЛЬНЫЕ РЕКЛАМНЫЕ ЗОНЫ */
        .banner-wrapper { 
            width: 100%; 
            background: rgba(7, 8, 16, 0.5); 
            border: 1px dashed rgba(102,252,241,0.4); 
            border-radius: 14px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 10px; 
            text-align: center; 
            font-size: 11px; 
            color: #66fcf1; 
            min-height: 55px; 
            overflow: hidden; 
            transition: border-color 0.3s;
        }
        .banner-wrapper:hover { border-color: #45f3ff; }
        .banner-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; }
        
        .links-wrapper { 
            width: 100%; 
            background: rgba(7, 8, 16, 0.6); 
            border: 1px solid rgba(69, 243, 255, 0.2); 
            border-radius: 16px; 
            padding: 14px; 
            font-size: 13px; 
            color: #c5c6c7; 
            line-height: 1.6; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        .links-title { font-size: 10px; color: #45f3ff; font-weight: bold; letter-spacing: 1px; border-bottom: 1px solid rgba(102,252,241,0.15); padding-bottom: 5px; margin-bottom: 3px; text-transform: uppercase; }

        /* ИНТЕРФЕЙС ЭКРАНОВ */
        .screen { display: none; flex-direction: column; gap: 15px; width: 100%; }
        .screen.active { display: flex; }

        /* ЖИВОЙ СТИЛЬНЫЙ ЧАТ */
        .chat-container { 
            width: 100%; 
            background: rgba(7, 8, 16, 0.7); 
            border: 1px solid rgba(69, 243, 255, 0.25); 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            height: 310px; 
            overflow: hidden; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        .chat-header { 
            background: linear-gradient(90deg, rgba(102,252,241,0.15) 0%, rgba(219,123,242,0.05) 100%); 
            padding: 10px 14px; 
            font-size: 11px; 
            font-weight: bold; 
            color: #66fcf1; 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 1px solid rgba(102,252,241,0.15); 
            letter-spacing: 0.5px; 
        }
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .msg-item { 
            background: rgba(31, 40, 51, 0.5); 
            padding: 10px 12px; 
            border-radius: 12px; 
            border-left: 3px solid #db7bf2; 
            word-break: break-all;
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .msg-meta { font-size: 10px; color: #45f3ff; font-weight: bold; margin-bottom: 3px; display: flex; justify-content: space-between; }
        
        .chat-inputs { display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #1f2833; border-top: 1px solid rgba(102,252,241,0.15); }
        .chat-row { display: flex; gap: 8px; }
        .chat-in { 
            background: #0b0c10; 
            border: 1px solid rgba(69, 243, 255, 0.2); 
            padding: 10px; 
            border-radius: 10px; 
            color: #fff; 
            font-size: 13px; 
            outline: none; 
            transition: border-color 0.2s;
        }
        .chat-in:focus { border-color: #45f3ff; box-shadow: 0 0 10px rgba(102,252,241,0.1); }
        .btn-send { 
            background: linear-gradient(90deg, #66fcf1 0%, #db7bf2 100%); 
            border: none; 
            color: #0b0c10; 
            font-weight: bold; 
            border-radius: 10px; 
            font-size: 11px; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }
        .btn-send:active { transform: scale(0.98); }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ (ТОЛЬКО ДЛЯ ВАС) */
        .admin-panel { background: rgba(11, 12, 16, 0.95); border: 2px solid #e74c3c; padding: 18px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 0 30px rgba(231,76,60,0.2); }
        .code-textarea { background: #1f2833; border: 1px solid #2c3147; padding: 10px; border-radius: 8px; color: #fff; font-size: 12px; height: 55px; resize: none; outline: none; font-family: monospace; }
        .code-textarea:focus { border-color: #e74c3c; }
        .adm-btn { width: 100%; height: 40px; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 11px; }
    </style>
</head>
<body>

    <div class="header-partner-block" id="zoneTop">[ Зона верхнего баннера ]</div>

    <div class="portal-shell">
        <div class="portal-header">
            <h1>MATRIX TRAFFIC</h1>
            <p>Автоматическая рекламная платформа</p>
        </div>

        <!-- VIP БЛОК АДМИНИСТРАТОРА -->
        <div class="vip-admin-block">
            <div class="vip-badge">👑 VIP СЛОТ</div>
            <div class="vip-title" id="lblVipTitle">Связь с админом по поводу рекламы! Купить этот блок напрямую через ВК</div>
            <img src="" id="imgVipBanner" class="vip-banner-img" alt="VIP Реклама">
            <a href="https://vk.ru" target="_blank" id="btnVipLink" class="vk-btn">Написать админу в ВК</a>
        </div>

        <!-- ЭКРАН 1: АВТОРИЗАЦИЯ ДЛЯ ВХОДА В ЧАТ (И СПАСИТЕЛЬНАЯ АДМИНКА) -->
        <div class="screen active" id="scrAuth">
            <div class="chat-inputs" style="border-top:none; border-radius:16px; background: rgba(7, 8, 16, 0.4); border: 1px solid rgba(102,252,241,0.15);">
                <p style="font-size:12px; text-align:center; color:#c5c6c7; margin-bottom:5px;">Введите ваш никнейм для доступа к функциям платформы</p>
                <input type="text" id="inAuthNick" class="chat-in" placeholder="Ваш игровой ник..." style="text-align:center;" maxlength="15">
                <button class="btn-send" style="height:44px;" onclick="handlePortalLogin()">Войти на платформу</button>
            </div>
        </div>

        <!-- ЭКРАН 2: САМ ЧАТ И БАННЕРЫ (ОТКРЫВАЕТСЯ ДЛЯ ВСЕХ ПОЛЬЗОВАТЕЛЕЙ) -->
